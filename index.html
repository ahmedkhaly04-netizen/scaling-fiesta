<script>
(() => {
'use strict';
const $ = (s,root=document) => root.querySelector(s);
const escapeHtml = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const notes = [
'مساء الخير. النهاردة مش هنكتفي بحفظ رموز الخوارزميات؛ هنشوف البيانات وهي بتتحرك داخل المخطط. تخيلوا إن كل خطوة محطة، وإن القرار بيفتح طريقًا مختلفًا حسب البيانات. هنبدأ بالمفاهيم البسيطة وبعدين نحل ست مسائل بالتدريج. وفي كل حل هنجرب أرقام حقيقية ونشوف النتيجة بنفسنا. سؤال البداية: هل الكمبيوتر بيفهم المطلوب من غير خطوات واضحة؟',
'الخوارزمية ببساطة ترتيب محدد من الخطوات للوصول لنتيجة. زي وصفة الطبخ: نبدأ بمدخلات، ثم ننفذ عمليات بترتيب، وفي النهاية نحصل على مخرجات. لازم تكون الخطوات واضحة وقابلة للتنفيذ وتتوقف. خلونا نتتبع مثال تحضير مشروب: اختيار الطلب ثم تجهيز المكونات ثم التحضير ثم التسليم. هل ممكن نبدّل ترتيب بعض الخطوات من غير ما تتغير النتيجة؟',
'المخطط الانسيابي هو طريقة لرسم الخوارزمية بدل ما نكتفي بالوصف. الشكل البيضاوي للبداية والنهاية، ومتوازي الأضلاع للإدخال والإخراج، والمستطيل للعمليات، والمعيّن للسؤال الذي له مسارات. اضغطوا على الرموز؛ كل واحد له وظيفة محددة. ليه مينفعش نمثل مقارنة مثل هل العدد أكبر من الصفر بمستطيل عملية عادي؟ لأن المقارنة بتحدد أي مسار هنمشي فيه.',
'قبل أي رسم لازم نفهم المسألة أولًا. بنحدد البيانات اللي عندنا، والمطلوب، والعمليات اللازمة، وأي قرارات، وبعدها نرتب الخطوات. في الآخر بنختبر الخوارزمية بأكثر من حالة، مش بمثال واحد فقط. مهمة المبرمج مش يرسم أسهم بشكل جميل؛ المهمة إنه يبني منطق صحيح يوصل للنتيجة.',
'المسألة الأولى بسيطة: عندنا عددان، ومطلوب مجموعهما. فكروا: ما البيانات الداخلة؟ هل نحتاج قرارًا؟ وما الشيء الذي سنطبعه في النهاية؟ أديكم لحظة للتفكير قبل الانتقال إلى الحل. حاولوا تتوقعوا عدد مربعات العمليات المطلوبة.',
'دلوقتي بنقرأ العددين أولًا، ثم بنحسب sum = a + b، وبعدها بنعرض sum. استخدمنا رمز الإدخال لقراءة القيم، ومستطيل العملية للجمع، ورمز الإخراج لعرض النتيجة. جرّبوا تغيير a وb واضغطوا تنفيذ خطوة بخطوة. هتلاحظوا إن النتيجة تتغير فعلًا، مش مجرد رسم محفوظ.',
'المسألة الثانية بتضيف عمليتين على نفس البيانات. عندنا طول وعرض مستطيل، وعايزين المساحة والمحيط. السؤال هنا: هل نحتاج مدخلات مختلفة لكل عملية؟ لا، نفس الطول والعرض بيستخدموا في الحالتين. فكروا في المعادلتين قبل الحل.',
'هنقرأ الطول والعرض، ثم المساحة تساوي الطول في العرض، والمحيط يساوي 2 في مجموع الطول والعرض. كل عملية مستقلة ولكنها تعتمد على نفس المدخلات. جربوا مثلاً طول 6 وعرض 3: المساحة 18 والمحيط 18 أيضًا، وده مجرد تساوي عددي في هذه الحالة؛ المعنى والوحدات مختلفان.',
'دلوقتي أول مسألة قرارات. هنحدد إذا العدد موجب أو سالب أو صفر. محتاجين نفحص هل أكبر من الصفر؟ لو نعم نعرض موجب. لو لا، هل أصغر من الصفر؟ لو نعم نعرض سالب، وإلا فهو صفر. فكروا ليه لازم نختبر حالة الصفر بصورة منفصلة.',
'هنا المعيّن مهم جدًا، لأنه يختار واحدًا من مسارات متعددة حسب قيمة x. جرّبوا x يساوي 7 ثم -3 ثم صفر. هتشوفوا مسار القرار يتغير في كل مرة. وضحوا إن الفحص الأول وحده مش كفاية؛ عدم الإيجابية قد يكون سالبًا أو صفرًا.',
'المسألة الرابعة بتطلب أكبر عدد بين عددين، مع مراعاة التساوي. ممكن نبدأ بشرط a > b. ولو الشرط غلط، هل تلقائيًا b أكبر؟ لأ، ممكن يكونوا متساويين؛ لذلك محتاجين اختبارًا ثانيًا. حاولوا تتوقعوا مسارات المخطط.',
'هنعمل شرطًا أول: a > b، لو صح نعرض a. ولو غلط نفحص a < b، إن كان صح نعرض b، وإلا نعرض إن العددين متساويان. جرّبوا قيمتين متساويتين؛ لو حذفنا فرع التساوي هيظهر خطأ منطقي حتى لو الحالات المعتادة صح.',
'دلوقتي مع التكرار. مطلوب مجموع الأعداد من 1 حتى n. لو عملنا جمع يدوي لكل عدد مش هنقدر نعمّم الحل. هنبدأ بمتغير sum يساوي صفر وعداد i يساوي واحد، ونكرر الجمع وزيادة العداد إلى أن يتجاوز n. فكّروا في أهمية تحديث العداد.',
'نفّذوا المحاكاة خطوة بخطوة. كل دورة هنختبر i <= n. لو الشرط صحيح نضيف i إلى sum، ثم نزود i واحد، وبعدها نرجع للاختبار. ولو الشرط غلط نخرج ونعرض المجموع. لاحظوا إن شرط التوقف هو اللي بيمنع حلقة لا نهائية.',
'التحدي الأخير بيجمع التكرار مع القرار: نجمع الأعداد الزوجية من 1 حتى n. داخل الحلقة نفحص هل i زوجي، أي باقي قسمته على 2 يساوي صفر. لو نعم نضيفه إلى المجموع، ولو لا نتجاوزه. ما الفرق بين هذه المسألة والمسألة السابقة؟',
'في الحل هنلاحظ وجود حلقة وشَرط داخلها. بعد فحص الزوجية، المساران بيرجعوا لتحديث العداد ثم إعادة اختبار الحد الأعلى. جرّبوا n يساوي 6؛ نجمع 2 و4 و6 فنحصل على 12. ولو n يساوي 5، المجموع 6. خلونا نتتبع تنفيذ الحالتين.',
'الآن اختبار صغير للتأكد من فهم الرموز والمنطق ونتائج التنفيذ. مش المهم نختار إجابة صحيحة بالصدفة؛ بعد كل إجابة هيظهر تفسير، وخصوصًا سبب الخطأ لو الإجابة غير صحيحة. هنختبر ست أفكار مرّينا عليها، وبنقدر نعيد الاختبار.',
'في النهاية شفنا رحلة كاملة: من فهم السؤال إلى المدخلات والعمليات والقرارات والمخرجات. واتعلمنا نراجع الحل بالتجربة، مش بالشكل وحده. المخطط الانسيابي بيخلّي طريقة التفكير مرئية. أهم نصيحة: كل ما تقابلوا سؤالًا جديدًا، اسألوا نفسكوا ما المطلوب، وما المدخلات، وما المسار الصحيح للوصول للنتيجة؟'
];
const problems = [
{title:'جمع عددين',level:'مبتدئ',headline:'اكتب خوارزمية تقرأ عددين ثم تعرض مجموعهما.',description:'ابدأ بأبسط مثال على المدخلات والعمليات والمخرجات.',goal:'احسب مجموع العددين a و b، ثم اطبع الناتج.',given:'عددان a و b يحددهما المستخدم.',hint:'تحتاج إدخال العددين، ثم عملية جمع واحدة، ثم إخراج الناتج. لا تحتاج إلى شرط.',inputs:[['a',4],['b',7]],code:'READ a, b\nsum = a + b\nPRINT sum',notes:'نقرأ قيمتين ثم نجمعهما. هذه خوارزمية تسلسلية لا تحتوي على شروط.',type:'simple',nodes:[['start','Start','start',350,58],['input','Read a, b','input',350,159],['calc','sum = a + b','process',350,260],['out','Print sum','output',350,361],['end','End','end',350,462]],edges:[['start','input'],['input','calc'],['calc','out'],['out','end']],simulate(v){const {a,b}=v,sum=a+b;return [S('start','نبدأ تنفيذ الخوارزمية.',{}),S('input','نقرأ العددين من المدخلات.',{a,b}),S('calc','نجمع العددين ونخزن النتيجة في sum.',{a,b,sum}),S('out','نعرض قيمة sum وهي '+fmt(sum)+'.',{a,b,sum},fmt(sum)),S('end','انتهى التنفيذ بعد عرض الناتج.',{a,b,sum})]}},
{title:'مساحة ومحيط مستطيل',level:'مبتدئ +',headline:'صمّم خوارزمية تحسب مساحة مستطيل ومحيطه.',description:'نفس المدخلات ستُستخدم في عمليتين مختلفتين.',goal:'احسب المساحة = الطول × العرض، والمحيط = 2 × (الطول + العرض).',given:'الطول L والعرض W، وهما موجبان.',hint:'بعد إدخال L وW نفّذ عمليتين حسابيتين ثم اطبع نتيجتين مختلفتين.',inputs:[['L',6],['W',3]],code:'READ L, W\narea = L * W\nperimeter = 2 * (L + W)\nPRINT area, perimeter',notes:'المدخلات هي الطول والعرض، والنتائج اثنتان مختلفتان في المعنى والوحدات.',nodes:[['start','Start','start',350,48],['input','Read L, W','input',350,137],['area','area = L × W','process',350,226],['peri','p = 2(L + W)','process',350,315],['out','Print area, p','output',350,404],['end','End','end',350,493]],edges:[['start','input'],['input','area'],['area','peri'],['peri','out'],['out','end']],simulate(v){let {L,W}=v;if(L<=0||W<=0)throw Error('الطول والعرض يجب أن يكونا أكبر من الصفر.');const area=L*W,perimeter=2*(L+W);return[S('start','نبدأ ببيانات المستطيل.',{}),S('input','نقرأ الطول والعرض.',{L,W}),S('area','نضرب الطول في العرض لحساب المساحة.',{L,W,area}),S('peri','نحسب ضعف مجموع الطول والعرض.',{L,W,area,perimeter}),S('out',`نعرض المساحة ${fmt(area)} والمحيط ${fmt(perimeter)}.`,{L,W,area,perimeter},`المساحة ${fmt(area)} | المحيط ${fmt(perimeter)}`),S('end','انتهى حساب المساحة والمحيط.',{L,W,area,perimeter})]}},
{title:'موجب أم سالب أم صفر؟',level:'متوسط',headline:'صمّم خوارزمية تحدد إشارة العدد.',description:'ستتعلم كيف يوجّه قرارٌ واحد أو أكثر تدفق التنفيذ.',goal:'اطبع «موجب» أو «سالب» أو «صفر» حسب قيمة x.',given:'عدد حقيقي واحد هو x.',hint:'افحص x > 0 أولًا، ثم x < 0 عند عدم تحقق الشرط الأول؛ ما الذي يتبقى؟',inputs:[['x',-3]],code:'READ x\nIF x > 0 THEN PRINT "Positive"\nELSE IF x < 0 THEN PRINT "Negative"\nELSE PRINT "Zero"',notes:'ليس كل عدد غير موجب سالبًا؛ قد يكون صفرًا. لذلك نحتاج مسارًا ثالثًا.',nodes:[['start','Start','start',350,42],['input','Read x','input',350,116],['d1','x > 0 ?','decision',350,217],['positive','Print Positive','output',128,340],['d2','x < 0 ?','decision',555,340],['negative','Print Negative','output',420,462],['zero','Print Zero','output',675,462],['end','End','end',350,562]],edges:[['start','input'],['input','d1'],['d1','positive','Yes'],['d1','d2','No'],['positive','end'],['d2','negative','Yes'],['d2','zero','No'],['negative','end'],['zero','end']],simulate(v){const {x}=v;let t=[S('start','بدء اختبار إشارة العدد.',{}),S('input','نقرأ قيمة x.',{x}),S('d1',`نختبر: هل ${fmt(x)} > 0 ؟ الإجابة ${x>0?'نعم':'لا'}.`,{x},null,x>0?'Yes':'No')];if(x>0)t.push(S('positive','العدد أكبر من الصفر: موجب.',{x},'موجب'));else{t.push(S('d2',`نختبر: هل ${fmt(x)} < 0 ؟ الإجابة ${x<0?'نعم':'لا'}.`,{x},null,x<0?'Yes':'No'));t.push(x<0?S('negative','العدد أصغر من الصفر: سالب.',{x},'سالب'):S('zero','العدد يساوي صفرًا تمامًا.',{x},'صفر'))}return [...t,S('end','توقّفنا بعد اختيار الفرع الصحيح.',{x})]}},
{title:'الأكبر بين عددين',level:'متوسط +',headline:'ابحث عن العدد الأكبر، ولا تنسَ حالة التساوي.',description:'اختبار شرطي ثانٍ يعالج حالة لا يغطيها الشرط الأول.',goal:'اطبع الأكبر بين a وb، أو أخبرنا أنهما متساويان.',given:'عددان حقيقيان a و b.',hint:'إذا كان a ليس أكبر من b، فذلك لا يعني دائمًا أن b أكبر؛ قد يكونان متساويين.',inputs:[['a',12],['b',12]],code:'READ a, b\nIF a > b THEN PRINT a\nELSE IF a < b THEN PRINT b\nELSE PRINT "Equal"',notes:'فرع التساوي ضروري حتى لا يعطي البرنامج نتيجة خاطئة عندما a = b.',nodes:[['start','Start','start',350,42],['input','Read a, b','input',350,116],['d1','a > b ?','decision',350,217],['aout','Print a','output',128,340],['d2','a < b ?','decision',555,340],['bout','Print b','output',420,462],['equal','Print Equal','output',675,462],['end','End','end',350,562]],edges:[['start','input'],['input','d1'],['d1','aout','Yes'],['d1','d2','No'],['aout','end'],['d2','bout','Yes'],['d2','equal','No'],['bout','end'],['equal','end']],simulate(v){let{a,b}=v,t=[S('start','بدء المقارنة.',{}),S('input','نقرأ العددين.',{a,b}),S('d1',`هل ${fmt(a)} > ${fmt(b)}؟ ${a>b?'نعم':'لا'}.`,{a,b},null,a>b?'Yes':'No')];if(a>b)t.push(S('aout','العدد a هو الأكبر.',{a,b},fmt(a)));else{t.push(S('d2',`هل ${fmt(a)} < ${fmt(b)}؟ ${a<b?'نعم':'لا'}.`,{a,b},null,a<b?'Yes':'No'));t.push(a<b?S('bout','العدد b هو الأكبر.',{a,b},fmt(b)):S('equal','القيمتان متساويتان.',{a,b},'متساويان'))}return [...t,S('end','انتهت المقارنة بنجاح.',{a,b})]}},
{title:'مجموع من 1 إلى n',level:'متقدم',headline:'احسب مجموع الأعداد الطبيعية من 1 حتى n.',description:'أول خوارزمية تتضمن حلقة تكرار وعدادًا متغيرًا.',goal:'اطبع 1 + 2 + ... + n باستخدام حلقة.',given:'عدد صحيح n بين 1 و10 لتتبّع التنفيذ بوضوح.',hint:'ابدأ sum = 0 وi = 1، ثم كرر الجمع طالما i ≤ n، ولا تنسَ i = i + 1.',inputs:[['n',5]],code:'READ n\nsum = 0; i = 1\nWHILE i <= n:\n    sum = sum + i\n    i = i + 1\nPRINT sum',notes:'شرط الحلقة يتغير بزيادة i كل مرة؛ لذلك يتوقف التنفيذ عندما يصبح i أكبر من n.',nodes:[['start','Start','start',345,44],['input','Read n','input',345,123],['init','sum=0; i=1','process',345,211],['check','i ≤ n ?','decision',345,320],['add','sum = sum + i','process',158,450],['inc','i = i + 1','process',158,542],['out','Print sum','output',570,450],['end','End','end',570,554]],edges:[['start','input'],['input','init'],['init','check'],['check','add','Yes'],['add','inc'],['inc','check'],['check','out','No'],['out','end']],simulate(v){let n=v.n;if(!Number.isInteger(n)||n<1||n>10)throw Error('في هذا العرض أدخل عددًا صحيحًا من 1 إلى 10.');let sum=0,i=1,t=[S('start','بداية حساب مجموع الأعداد.',{}),S('input','نقرأ الحد الأعلى n.',{n}),S('init','نجهّز sum = 0 والعداد i = 1.',{n,sum,i})];while(true){let yes=i<=n;t.push(S('check',`هل ${i} ≤ ${n}؟ ${yes?'نعم: نكرر':'لا: انتهت الحلقة'}.`,{n,sum,i},null,yes?'Yes':'No'));if(!yes)break;sum+=i;t.push(S('add',`نضيف ${i} إلى sum، فيصبح ${sum}.`,{n,sum,i}));i++;t.push(S('inc',`نزيد العداد: i = ${i}.`,{n,sum,i}))}t.push(S('out',`المجموع النهائي ${sum}.`,{n,sum,i},fmt(sum)),S('end','انتهى التنفيذ بعد تحقق شرط التوقف.',{n,sum,i}));return t}},
{title:'مجموع الأعداد الزوجية',level:'تحدٍ متقدم',headline:'اجمع الأعداد الزوجية من 1 إلى n فقط.',description:'التحدي يجمع بين التكرار والقرار والعمليات الحسابية.',goal:'احسب مجموع الأعداد التي باقي قسمتها على 2 يساوي صفرًا.',given:'عدد صحيح n بين 1 و10.',hint:'داخل الحلقة استخدم الشرط i % 2 == 0. أضف i إلى sum فقط إذا تحقّق الشرط، ثم زِد العداد في الحالتين.',inputs:[['n',6]],code:'READ n\nsum = 0; i = 1\nWHILE i <= n:\n    IF i % 2 == 0:\n        sum = sum + i\n    i = i + 1\nPRINT sum',notes:'باقي القسمة على 2 يساوي صفرًا للأعداد الزوجية فقط. نحدث العداد سواء أضفنا العدد أو تخطيناه.',nodes:[['start','Start','start',350,45],['input','Read n','input',350,128],['init','sum=0; i=1','process',350,215],['check','i ≤ n ?','decision',350,326],['even','i % 2 = 0 ?','decision',168,445],['add','sum = sum + i','process',130,555],['inc','i = i + 1','process',366,632],['out','Print sum','output',585,445],['end','End','end',585,554]],edges:[['start','input'],['input','init'],['init','check'],['check','even','Yes'],['check','out','No'],['even','add','Yes'],['even','inc','No'],['add','inc'],['inc','check'],['out','end']],simulate(v){let n=v.n;if(!Number.isInteger(n)||n<1||n>10)throw Error('في هذا العرض أدخل عددًا صحيحًا من 1 إلى 10.');let sum=0,i=1,t=[S('start','نبدأ التحدي.',{}),S('input','نقرأ n.',{n}),S('init','نهيئ المجموع والعداد.',{n,sum,i})];while(true){let yes=i<=n;t.push(S('check',`هل ${i} ≤ ${n}؟ ${yes?'نعم':'لا'}.`,{n,sum,i},null,yes?'Yes':'No'));if(!yes)break;let even=i%2===0;t.push(S('even',`هل ${i} عدد زوجي؟ ${even?'نعم':'لا'}.`,{n,sum,i},null,even?'Yes':'No'));if(even){sum+=i;t.push(S('add',`العدد ${i} زوجي، نضيفه فيصبح sum = ${sum}.`,{n,sum,i}))}i++;t.push(S('inc',`ننتقل للعدد التالي: i = ${i}.`,{n,sum,i}))}t.push(S('out',`مجموع الأعداد الزوجية = ${sum}.`,{n,sum,i},fmt(sum)),S('end','اكتمل التنفيذ.',{n,sum,i}));return t}}

function rgb(hex){hex=hex.replace('#','');return [parseInt(hex.slice(0,2),16),parseInt(hex.slice(2,4),16),parseInt(hex.slice(4,6),16)]}
function mixColor(color,mult,alpha=1){let [r,g,b]=rgb(color);return `rgba(${Math.min(255,Math.max(0,Math.round(r*mult)))},${Math.min(255,Math.max(0,Math.round(g*mult)))},${Math.min(255,Math.max(0,Math.round(b*mult)))},${alpha})`}
function drawCoreFrame(){const canvas=$('#coreCanvas');if(!canvas)return;const r=canvas.getBoundingClientRect();if(r.width<2||r.height<2)return;const dpr=Math.min(window.devicePixelRatio||1,2),w=Math.round(r.width*dpr),h=Math.round(r.height*dpr);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}const c=canvas.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);const W=r.width,H=r.height;c.clearRect(0,0,W,H);let t=(performance.now()/1000);if(state.reduce)t=6;const cx=W*.52,cy=H*.51,R=Math.min(W,H)*.29,light=norm([.5,-.7,1]);
function rotate(v){let a=t*.27+.3,b=t*.19-.3;let x=v[0]*Math.cos(a)-v[2]*Math.sin(a),z=v[0]*Math.sin(a)+v[2]*Math.cos(a),y=v[1];let yy=y*Math.cos(b)-z*Math.sin(b),zz=y*Math.sin(b)+z*Math.cos(b);return[x,yy,zz]}
function project(v){const z=3.6-v[2]*.65,f=3.6/z;return[cx+v[0]*R*f,cy+v[1]*R*f,f]}
const points=rawVerts.map(v=>rotate(v).map(x=>x*1.1));const faceData=faces.map((ids,i)=>{const a=points[ids[0]],b=points[ids[1]],cc=points[ids[2]];let n=norm(cross(sub(b,a),sub(cc,a)));let brightness=.55+Math.max(0,dot(n,light))*.47;return{verts:ids.map(idx=>project(points[idx])),z:(a[2]+b[2]+cc[2])/3,brightness,index:i}}).sort((a,b)=>a.z-b.z);
// An orbiting ribbon in 3D, behind the icosahedron.
function orbit(rot,rad,color,width,offset){c.beginPath();for(let i=0;i<=200;i++){let p=i/200*Math.PI*2;let v=[Math.cos(p)*rad,Math.sin(p)*rad*.42,Math.sin(p)*.43];let yy=v[1]*Math.cos(rot)-v[2]*Math.sin(rot),zz=v[1]*Math.sin(rot)+v[2]*Math.cos(rot),pp=project([v[0],yy,zz]);if(i===0)c.moveTo(pp[0],pp[1]);else c.lineTo(pp[0],pp[1])}c.lineWidth=width;c.strokeStyle=color;c.stroke()}
const isDark=state.theme==='dark';c.save();c.globalAlpha=.65;orbit(.55+t*.12,1.55,isDark?'rgba(84,222,190,.46)':'rgba(0,169,149,.39)',2);orbit(2.4-t*.08,1.4,isDark?'rgba(255,133,93,.56)':'rgba(255,103,71,.35)',1.6);c.restore();
for(const face of faceData){c.beginPath();face.verts.forEach((v,i)=>{if(i===0)c.moveTo(v[0],v[1]);else c.lineTo(v[0],v[1])});c.closePath();let main=face.index%5===0?'#ffc75e':face.index%3===0?'#ff7352':'#00ad9f';c.fillStyle=mixColor(main,face.brightness,isDark?.96:.91);c.strokeStyle=isDark?'rgba(225,255,248,.24)':'rgba(16,35,36,.25)';c.lineWidth=1.2;c.fill();c.stroke()}
// Floating data cubes and small 3D satellites.
for(let k=0;k<22;k++){let ang=k*2.399+t*(k%2?-.19:.26),radius=1.55+(k%4)*.09,z=Math.sin(k*1.3+t*.55)*.55,coords=project([Math.cos(ang)*radius,Math.sin(ang)*radius*.72,z]),size=(k%5===0?6:2.9)*coords[2];c.beginPath();c.arc(coords[0],coords[1],size,0,Math.PI*2);c.fillStyle=k%3===0?'#ff9b75':k%2===0?'#2bccb5':'#f9c764';c.shadowColor=c.fillStyle;c.shadowBlur=k%5===0?15:5;c.fill();c.shadowBlur=0}
// Floating core dot, in front of model.
c.beginPath();c.arc(cx,cy,8,0,Math.PI*2);c.fillStyle=isDark?'#f9d47d':'#ffffff';c.shadowColor='#ffbd69';c.shadowBlur=20;c.fill();c.restore();if(!state.reduce&&document.visibilityState==='visible'&&(state.slide===0||state.slide===17))coreLoop=requestAnimationFrame(drawCoreFrame)}
function animationLoopStop(){if(coreLoop!=null){cancelAnimationFrame(coreLoop);coreLoop=null}}
const oldGo=go;go=function(n){animationLoopStop();oldGo(n)};
init();
